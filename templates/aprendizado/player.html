{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ aula.modulo.curso.cor_primaria }}">
  <title>{{ aula.titulo }} — {{ aula.modulo.curso.titulo }}</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/fontes.css' %}">
  <link rel="stylesheet" href="{% static 'css/player.css' %}">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="player" data-sair-url="{{ sair_url }}" data-previa="{{ previa|yesno:'1,0' }}"></div>
  {{ dados|json_script:"dados-aula" }}
  {{ estado|json_script:"estado-aula" }}
  <script src="{% static 'vendor/gsap.min.js' %}" defer></script>
  <script src="{% static 'vendor/lottie_light.min.js' %}" defer></script>
  <script src="{% static 'js/player.bundle.js' %}" defer></script>
  <script src="{% static 'js/pagina-aula.js' %}" defer></script>
</body>
</html>
