{% extends "estudio/_base.html" %}
{% block trilha %} › {{ titulo }}{% endblock %}
{% block estudio %}
  <div class="cartao max-w-2xl">
    <h1 class="mb-6">{{ titulo }}</h1>
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "_form.html" %}
      <div class="flex gap-2"><button class="btn">Salvar</button>
        <a class="btn-sec" href="javascript:history.back()">Cancelar</a></div>
    </form>
  </div>
{% endblock %}
