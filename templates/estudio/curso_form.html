{% extends "estudio/_base.html" %}
{% block trilha %} › {% if curso %}Editar{% else %}Novo curso{% endif %}{% endblock %}
{% block estudio %}
  <div class="cartao max-w-3xl">
    <h1 class="mb-6">{% if curso %}Editar curso{% else %}Novo curso{% endif %}</h1>
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "_form.html" %}
      <div class="flex gap-2"><button class="btn">Salvar</button>
        <a class="btn-sec" href="{% if curso %}{% url 'estudio:curso' curso.pk %}{% else %}{% url 'estudio:painel' %}{% endif %}">Cancelar</a></div>
    </form>
  </div>
{% endblock %}
