{% extends "core/_cartao.html" %}
{% block titulo %}Criar conta — MayaAcademy{% endblock %}
{% block cartao_titulo %}Criar conta{% endblock %}
{% block cartao %}
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next|default:request.POST.next|default:'' }}">
    {% include "_form.html" %}
    <button class="btn w-full">Criar conta</button>
  </form>
  <p class="mt-4 text-sm">Já tem conta? <a href="{% url 'core:login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Entrar</a></p>
{% endblock %}
