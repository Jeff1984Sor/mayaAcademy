{% extends "core/_cartao.html" %}
{% block cartao_titulo %}Nova senha{% endblock %}
{% block cartao %}
  {% if validlink %}
    <form method="post">{% csrf_token %}{% include "_form.html" %}<button class="btn w-full">Salvar nova senha</button></form>
  {% else %}
    <p>Este link é inválido ou já foi usado. <a href="{% url 'core:senha_recuperar' %}">Peça um novo</a>.</p>
  {% endif %}
{% endblock %}
